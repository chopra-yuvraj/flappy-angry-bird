<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Angry Bird | Play Now — Yuvraj Chopra</title>
    <meta name="description" content="Play Flappy Angry Bird directly in your browser! A premium arcade game built with Python, Pygame, and WebAssembly by Yuvraj Chopra.">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --sky: #4EC0CA;
            --sky-deep: #2A8A92;
            --gold: #F4CE5E;
            --gold-bright: #FFE07D;
            --dark: #1A2332;
            --dark-mid: #2C3E50;
            --white: #FFFFFF;
            --bird-red: #E03030;
            --pipe-green: #22B14C;
            --ground: #DEB887;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(175deg, var(--sky) 0%, var(--sky-deep) 60%, var(--ground) 85%, #8B6B3D 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            color: var(--white);
        }

        /* ─── Animated clouds ─── */
        .cloud {
            position: fixed;
            background: rgba(255,255,255,0.45);
            border-radius: 60px;
            z-index: 1;
            pointer-events: none;
        }
        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: inherit;
            border-radius: 50%;
        }
        .cloud::before { width: 55%; height: 130%; top: -50%; left: 18%; }
        .cloud::after  { width: 40%; height: 110%; top: -30%; right: 15%; }

        .c1 { width: 140px; height: 45px; top: 8%;  animation: drift 28s linear infinite; }
        .c2 { width: 200px; height: 65px; top: 22%; animation: drift 40s linear infinite; animation-delay: -8s; }
        .c3 { width: 110px; height: 38px; top: 45%; animation: drift 22s linear infinite; animation-delay: -15s; }
        .c4 { width: 170px; height: 55px; top: 14%; animation: drift 35s linear infinite; animation-delay: -3s; }
        .c5 { width: 90px;  height: 30px; top: 55%; animation: drift 30s linear infinite; animation-delay: -20s; }

        @keyframes drift {
            from { transform: translateX(-250px); }
            to   { transform: translateX(110vw); }
        }

        /* ─── Decorative pipes ─── */
        .pipe-deco {
            position: fixed;
            width: 50px;
            background: var(--pipe-green);
            border: 2px solid #0E6423;
            border-radius: 3px;
            z-index: 1;
            pointer-events: none;
        }
        .pipe-deco::after {
            content: '';
            position: absolute;
            left: -5px;
            width: 60px;
            height: 20px;
            background: var(--pipe-green);
            border: 2px solid #0E6423;
            border-radius: 3px;
        }
        .pipe-left  { left: 6%;  bottom: 0; height: 30%; }
        .pipe-left::after  { top: -20px; }
        .pipe-right { right: 8%; bottom: 0; height: 22%; }
        .pipe-right::after { top: -20px; }
        .pipe-top   { right: 15%; top: 0; height: 18%; }
        .pipe-top::after   { bottom: -20px; top: auto; }

        /* ─── Ground strip ─── */
        .ground-strip {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: linear-gradient(180deg, #6EC850 0%, #6EC850 15%, var(--ground) 15%, var(--ground) 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* ─── Main card ─── */
        .hero {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 560px;
            width: 92%;
            padding: 3.5rem 2.5rem 3rem;
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(18px) saturate(1.4);
            -webkit-backdrop-filter: blur(18px) saturate(1.4);
            border-radius: 28px;
            border: 1px solid rgba(255,255,255,0.35);
            box-shadow:
                0 30px 60px rgba(0,0,0,0.18),
                inset 0 1px 0 rgba(255,255,255,0.3);
            animation: cardIn 0.9s cubic-bezier(.34,1.56,.64,1);
        }

        @keyframes cardIn {
            0%   { transform: scale(0.6) translateY(40px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        /* Bird decoration on card */
        .bird-badge {
            position: absolute;
            top: -28px;
            right: -18px;
            width: 56px;
            height: 56px;
            background: var(--bird-red);
            border-radius: 50%;
            border: 3px solid var(--dark);
            box-shadow: 3px 4px 0 var(--dark);
            animation: birdBob 2.5s ease-in-out infinite;
        }
        .bird-badge::before {
            content: '';
            position: absolute;
            right: -12px;
            top: 14px;
            width: 0; height: 0;
            border-top: 8px solid transparent;
            border-bottom: 8px solid transparent;
            border-left: 14px solid var(--gold);
        }
        .bird-badge::after {
            content: '';
            position: absolute;
            top: 10px;
            left: 20px;
            width: 14px;
            height: 14px;
            background: var(--white);
            border-radius: 50%;
            border: 2px solid var(--dark);
            box-shadow: inset 4px 0 0 var(--dark);
        }

        @keyframes birdBob {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50%      { transform: translateY(-14px) rotate(-8deg); }
        }

        h1 {
            font-size: clamp(2.4rem, 7vw, 4rem);
            font-weight: 900;
            letter-spacing: -2px;
            line-height: 1.1;
            text-shadow: 3px 3px 0 rgba(0,0,0,0.12);
            margin-bottom: 0.6rem;
        }
        h1 .angry { color: var(--bird-red); }

        .tagline {
            font-size: clamp(1rem, 2.5vw, 1.25rem);
            font-weight: 400;
            color: rgba(255,255,255,0.85);
            margin-bottom: 2.2rem;
            line-height: 1.5;
        }

        /* ─── Play button ─── */
        .btn-play {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--gold);
            color: var(--dark);
            font-family: 'Outfit', sans-serif;
            font-size: clamp(1.2rem, 3vw, 1.6rem);
            font-weight: 800;
            padding: 1.1rem 3.5rem;
            border: none;
            border-radius: 100px;
            cursor: pointer;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            position: relative;
            overflow: hidden;
            transition: all 0.35s cubic-bezier(.4,0,.2,1);
            box-shadow:
                0 8px 24px rgba(244,206,94,0.35),
                0 2px 0 #D4AE3E;
        }
        .btn-play:hover {
            transform: translateY(-4px) scale(1.04);
            background: var(--gold-bright);
            box-shadow:
                0 16px 40px rgba(244,206,94,0.5),
                0 3px 0 #D4AE3E;
        }
        .btn-play:active {
            transform: translateY(0) scale(0.98);
            box-shadow: 0 4px 12px rgba(244,206,94,0.3);
        }
        .btn-play::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
            transition: left 0.6s;
        }
        .btn-play:hover::before { left: 100%; }

        .btn-icon {
            font-size: 1.3em;
            filter: drop-shadow(1px 1px 0 rgba(0,0,0,0.1));
        }

        /* ─── Feature pills ─── */
        .features {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin: 2rem 0 1.8rem;
        }
        .pill {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 100px;
            padding: 6px 16px;
            font-size: 0.82rem;
            font-weight: 500;
            color: rgba(255,255,255,0.9);
            backdrop-filter: blur(4px);
            transition: background 0.2s;
        }
        .pill:hover { background: rgba(255,255,255,0.25); }

        /* ─── Footer ─── */
        .credit {
            margin-top: 2rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: rgba(255,255,255,0.7);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        .credit a {
            color: var(--dark);
            background: var(--gold);
            padding: 2px 10px;
            border-radius: 4px;
            font-weight: 800;
            text-decoration: none;
            margin-left: 4px;
            transition: background 0.2s;
        }
        .credit a:hover { background: var(--gold-bright); }

        /* ─── Controls hint ─── */
        .controls {
            position: fixed;
            bottom: 72px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 18px;
            opacity: 0.6;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .controls span {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .key {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 5px;
            padding: 2px 8px;
            font-weight: 600;
            font-size: 0.75rem;
        }

        /* ─── Responsive ─── */
        @media (max-width: 480px) {
            .hero { padding: 2.5rem 1.5rem 2rem; }
            .features { gap: 6px; }
            .controls { display: none; }
            .pipe-deco { display: none; }
        }
    </style>
</head>
<body>
    <!-- Clouds -->
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
    <div class="cloud c4"></div>
    <div class="cloud c5"></div>

    <!-- Decorative pipes -->
    <div class="pipe-deco pipe-left"></div>
    <div class="pipe-deco pipe-right"></div>
    <div class="pipe-deco pipe-top"></div>

    <!-- Ground -->
    <div class="ground-strip"></div>

    <!-- Hero Card -->
    <main class="hero" id="hero-card">
        <div class="bird-badge" aria-hidden="true"></div>

        <h1>FLAPPY <span class="angry">ANGRY</span> BIRD</h1>
        <p class="tagline">The classic arcade game, rebuilt for the web with Python & WebAssembly.</p>

        <div class="features">
            <span class="pill">🎮 60 FPS</span>
            <span class="pill">🐍 Python + Pygame</span>
            <span class="pill">🌐 WebAssembly</span>
            <span class="pill">📱 Touch Support</span>
            <span class="pill">🏆 High Scores</span>
        </div>

        <a href="/play" class="btn-play" id="btn-play">
            <span class="btn-icon">▶</span> Play Now
        </a>

        <div class="credit">
            Crafted by <a href="https://github.com/chopra-yuvraj" target="_blank" rel="noopener">Yuvraj Chopra</a>
        </div>
    </main>

    <!-- Controls hint -->
    <div class="controls" aria-label="Game controls">
        <span><span class="key">SPACE</span> Flap</span>
        <span><span class="key">R</span> Restart</span>
        <span><span class="key">TAP</span> Mobile</span>
    </div>
</body>
</html>
