<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Angry Bird</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #87CEEB;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
        }
        canvas { display: block; background: #000; }
        #loading {
            color: #1A2332;
            font-size: 18px;
            text-align: center;
            padding: 20px;
        }
        .loading-spinner {
            width: 30px; height: 30px;
            border: 3px solid rgba(26,35,50,0.2);
            border-top-color: #F4CE5E;
            border-radius: 50%;
            animation: sp 0.7s linear infinite;
            margin: 12px auto;
        }
        @keyframes sp { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading">
        <div class="loading-spinner"></div>
        Initializing game engine…
    </div>
    <canvas id="pygame-canvas"></canvas>

    <script>
        // Placeholder — replaced by pygbag build output in production
        window.addEventListener('load', function() {
            var el = document.getElementById('loading');
            if (el) el.textContent = 'Game assets are being prepared…';
        });
    </script>
</body>
</html>
