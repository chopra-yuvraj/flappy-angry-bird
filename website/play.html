<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Play Flappy Angry Bird | Official Arcade</title>
    <meta name="description" content="Play Flappy Angry Bird live in your browser at 60 FPS. Built with HTML5 Canvas and Web Audio API by Yuvraj Chopra.">
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23E03030' stroke='%23000' stroke-width='2'/><circle cx='16' cy='22' r='8' fill='%23E6C8A0'/><circle cx='13' cy='12' r='4' fill='%23FFF' stroke='%23000' stroke-width='1.5'/><circle cx='21' cy='12' r='4' fill='%23FFF' stroke='%23000' stroke-width='1.5'/><circle cx='14.5' cy='12' r='1.5' fill='%23000'/><circle cx='22.5' cy='12' r='1.5' fill='%23000'/><path d='M10 8 L16 13 L24 8' stroke='%23000' stroke-width='2.5' stroke-linecap='round' fill='none'/><polygon points='16,14 26,17 16,21' fill='%23FFB41E' stroke='%23DC8C0A' stroke-width='1'/></svg>">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Core Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="play-page">

    <!-- Arcade Top Header Bar -->
    <header>
        <nav class="arcade-topbar" aria-label="Game Navigation">
            <a href="index.html" class="arcade-back" id="btn-back">
                &larr; Back
            </a>

            <div class="arcade-title">
                FLAPPY ANGRY BIRD
            </div>

            <div class="arcade-controls">
                <button type="button" class="icon-btn" id="btn-mute" aria-label="Toggle Sound" title="Mute / Unmute (M)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                </button>
                <button type="button" class="icon-btn" id="btn-pause" aria-label="Pause Game" title="Pause / Resume (P)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
                </button>
                <button type="button" class="icon-btn" id="btn-fullscreen" aria-label="Toggle Fullscreen" title="Toggle Fullscreen">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
                </button>
            </div>
        </nav>
    </header>

    <!-- Game Viewport Stage -->
    <main class="game-viewport">
        <div class="canvas-frame">
            <canvas id="game-canvas" width="400" height="600" aria-label="Flappy Angry Bird Game Screen"></canvas>
        </div>

        <!-- Floating HUD Helper -->
        <div class="hud-helper" aria-label="Quick Controls">
            <span><strong style="color: var(--white);">SPACE / TAP</strong> Flap</span>
            <span><strong style="color: var(--white);">TAB / S</strong> Hero</span>
            <span><strong style="color: var(--white);">P</strong> Pause</span>
            <span><strong style="color: var(--white);">R</strong> Restart</span>
            <span><strong style="color: var(--white);">M</strong> Audio</span>
        </div>
    </main>

    <!-- Canvas Game Script -->
    <script src="js/game.js"></script>
</body>
</html>
