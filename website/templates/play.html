<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Play Flappy Angry Bird | Yuvraj Chopra</title>
    <meta name="description" content="Play Flappy Angry Bird directly in your browser. Built with JavaScript Canvas by Yuvraj Chopra.">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --dark: #0f1520;
            --dark-card: #1a2235;
            --gold: #f4ce5e;
            --gold-glow: rgba(244,206,94,0.18);
            --sky: #50b4dc;
            --white: #ffffff;
            --white-dim: rgba(255,255,255,0.55);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; overflow: hidden; }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--white);
        }

        /* ── Top bar ── */
        .topbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            background: rgba(15,21,32,0.88);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            z-index: 100;
        }
        .back-btn {
            display: flex; align-items: center; gap: 6px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.08);
            color: var(--white-dim);
            font-family: 'Outfit', sans-serif;
            font-size: 0.88rem; font-weight: 600;
            padding: 7px 18px; border-radius: 100px;
            cursor: pointer; text-decoration: none;
            transition: all 0.2s;
        }
        .back-btn:hover { background: rgba(255,255,255,0.12); color: var(--white); }
        .topbar-title { font-weight: 800; font-size: 0.95rem; color: var(--white-dim); letter-spacing: 0.5px; }

        /* ── Game area ── */
        .game-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            animation: slideIn 0.5s ease-out;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .canvas-wrap {
            position: relative;
            border-radius: 14px;
            overflow: hidden;
            box-shadow:
                0 0 0 3px var(--gold),
                0 0 50px var(--gold-glow),
                0 28px 56px rgba(0,0,0,0.5);
        }

        canvas {
            display: block;
            background: var(--sky);
            cursor: pointer;
        }

        /* ── Controls hint ── */
        .controls {
            display: flex; gap: 18px;
            font-size: 0.76rem;
            color: var(--white-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .controls span { display: flex; align-items: center; gap: 5px; }
        .kbd {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.14);
            border-radius: 5px;
            padding: 2px 8px;
            font-weight: 700;
            font-size: 0.72rem;
        }

        .branding {
            font-size: 0.78rem;
            color: rgba(255,255,255,0.25);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* ── Responsive ── */
        @media (max-height: 720px) {
            canvas { width: 320px; height: 480px; }
        }
        @media (max-width: 440px) {
            canvas { width: 100vw; height: calc(100vw * 1.5); max-height: 75vh; }
            .canvas-wrap { border-radius: 0; box-shadow: none; border: none; }
            .controls { display: none; }
            .topbar { padding: 0 10px; }
        }
    </style>
</head>
<body>
    <nav class="topbar">
        <a href="/" class="back-btn" id="btn-back">← Home</a>
        <span class="topbar-title">FLAPPY ANGRY BIRD</span>
        <span></span>
    </nav>

    <div class="game-area">
        <div class="canvas-wrap">
            <canvas id="game-canvas" width="400" height="600"></canvas>
        </div>

        <div class="controls" aria-label="Game controls">
            <span><span class="kbd">SPACE</span> Flap</span>
            <span><span class="kbd">R</span> Restart</span>
            <span><span class="kbd">TAP</span> Mobile</span>
        </div>

        <div class="branding">Built by Yuvraj Chopra</div>
    </div>

    <script src="/static/js/game.js"></script>
</body>
</html>
